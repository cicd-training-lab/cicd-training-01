name: Secret check

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  secret-check:
    name: Secret check
    runs-on: ubuntu-24.04
    steps:
      - name: Use secret without writing it in the workflow
        env:
          TRAINING_API_TOKEN: ${{ secrets.TRAINING_API_TOKEN }}
        run: |
          if [ -n "$TRAINING_API_TOKEN" ]; then
            echo "TRAINING_API_TOKEN is set"
          else
            echo "TRAINING_API_TOKEN is empty"
            exit 1
          fi
          echo "value: $TRAINING_API_TOKEN"
